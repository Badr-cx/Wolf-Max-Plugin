name: Build WolfAudio
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: |
          sudo chown -R 0:0 data/
          sudo chmod -R 755 data/
          sudo tar --owner=0 --group=0 -cvzf "WolfAudio.ngz" data/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WolfAudio-Plugin
          path: ./WolfAudio.ngz
