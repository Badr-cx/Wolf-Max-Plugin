name: Build WolfAudio Plugin
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Extract and Locate Files
        run: |
          tar -xvf WolfAudio-Plugin.tar
          echo "Listing all directories to find 'data':"
          find . -type d -name "data"
          
      - name: Packaging
        run: |
          # هاد السطر غادي يلقى المسار الحقيقي ديال المجلد
          DATA_PATH=$(find . -type d -name "data" | head -n 1)
          
          if [ -d "$DATA_PATH" ]; then
            echo "Found data directory at: $DATA_PATH"
            # هنا كنطبقو الصلاحيات على المسار اللي لقيناه
            sudo chown -R 0:0 "$DATA_PATH"
            sudo chmod -R 755 "$DATA_PATH"
            
            # كنضغطو المجلد الأب ديال data باش يخرج لينا ngz صحيح
            # كنطلعو لمستوى واحد فوق data باش نضمنو الهيكلة صحيحة
            PARENT_DIR=$(dirname "$DATA_PATH")
            sudo tar --owner=0 --group=0 -cvzf "WolfAudio.ngz" -C "$PARENT_DIR" data
          else
            echo "Error: 'data' directory not found even after searching!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WolfAudio-Package
          path: ./WolfAudio.ngz
