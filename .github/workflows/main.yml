name: Build Wolf Gold Max Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install ARM Compiler and UPX
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf upx-ucl

    - name: Create WOLFSERVERMAX Source Code
      run: |
        cat << 'EOF' > WOLFSERVERMAX.c
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        #include <unistd.h>

        #define NCAM_SERVER_PATH "/data/plugin/wolf_cam/ncam.server"
        #define DROPBOX_URL "https://www.dropbox.com/scl/fi/jop020u2lzwbk6x02i8vc/ncam.server?rlkey=oq59ownodge0xnkvilo3s5d36&st=rehiwaw2&dl=1"

        int main() {
            char command[512];
            sprintf(command, "wget -q --no-check-certificate -O %s \"%s\"", NCAM_SERVER_PATH, DROPBOX_URL);
            while(1) {
                int result = system(command);
                if (result == 0) {
                    system("killall -9 ncam 2>/dev/null");
                    system("/data/plugin/wolf_cam/ncam -b -c /data/plugin/wolf_cam &");
                }
                sleep(600);
            }
            return 0;
        }
        EOF

    - name: Compile WOLFSERVERMAX for ARM
      run: |
        arm-linux-gnueabihf-gcc -static WOLFSERVERMAX.c -o WOLFSERVERMAX
        upx --brute WOLFSERVERMAX

    - name: Create Exact WOLFGOLD Directory Structure
      run: |
        # إنشاء نفس المجلد الرئيسي والمجلدات الفرعية المطابقة لـ WOLFGOLD
        mkdir -p WOLFGOLD/data/plugin/wolf_cam
        
        # كتابة ملف الوصف الكوري بنفس الفصالة والمسارات المطلوبة
        cat << 'EOF' > WOLFGOLD/data/plugin/Wolf-Max.descr
        # Wolf_Max_Plugin
        WOLF SERVER MAX |MA|( v1.0.0 )
        [NEW_API_V1]
        update_info :
        cur_ver_code : 100
        start_cmd : /data/plugin/wolf_cam/WOLFSERVERMAX
        stop_cmd : killall -9 WOLFSERVERMAX ncam
        uninstall :
        /data/plugin/wolf_cam
        /data/plugin/Wolf-Max.descr
        EOF

        # كتابة ملفات إعدادات الـ Ncam
        cat << 'EOF' > WOLFGOLD/data/plugin/wolf_cam/ncam.conf
        [global]
        active_readers = 1
        disablelog = 1
        clienttimeout = 5000
        [dvbapi]
        enabled = 1
        au = 1
        pmt_mode = 0
        request_mode = 1
        user = icone
        extended_cw_api = 2
        boxtype = pc
        EOF

        cat << 'EOF' > WOLFGOLD/data/plugin/wolf_cam/ncam.user
        [account]
        user = icone
        pwd = icone
        group = 1
        au = 1
        EOF

        echo "# TARGET FILE" > WOLFGOLD/data/plugin/wolf_cam/ncam.server

        # نقل المحرك المجمع للمسار الداخلي الجديد
        mv WOLFSERVERMAX WOLFGOLD/data/plugin/wolf_cam/
        chmod 755 WOLFGOLD/data/plugin/wolf_cam/WOLFSERVERMAX

        # إذا قمت برفع ملف ncam الأصلي للريبو، سيتم نقله تلقائياً للمكان المناسب وتعديل صلاحياته
        if [ -f "ncam" ]; then
          mv ncam WOLFGOLD/data/plugin/wolf_cam/
          chmod 755 WOLFGOLD/data/plugin/wolf_cam/ncam
        fi

    - name: Package Plugin into NGZ (WOLFGOLD Structure)
      run: |
        # ضغط مجلد WOLFGOLD بالكامل للحفاظ على الهيكل الداخلي الأصلي
        tar -cf Wolf-Max.ngz WOLFGOLD

    - name: Upload Finished Plugin
      uses: actions/upload-artifact@v4
      with:
        name: Wolf-Gold-Max-Package
        path: Wolf-Max.ngz
