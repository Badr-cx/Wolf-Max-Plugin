name: Build Max Audio Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Exact Audio Structure
      run: |
        # 1. إنشاء المجلدات بنفس الفصالة المعتمدة ف الجهاز
        mkdir -p data/plugin/wolf_audio
        mkdir -p data/tuxbox/config
        
        # 2. كتابة ملف الوصف (Descr) ف المجلد الرئيسي د الـ plugin
        cat << 'EOF' > data/plugin/Wolf-Audio.descr
        # Wolf_Audio_Plugin
        WOLF AUDIO SYSTEM |MA|( v1.0.0 )
        [NEW_API_V1]
        update_info :
        cur_ver_code : 100
        start_cmd : /data/plugin/wolf_audio/status.sh
        stop_cmd : 
        uninstall :
        /data/plugin/Wolf-Audio.descr
        /data/plugin/Wolf-Audio.png
        /data/plugin/wolf_audio
        /data/tuxbox/config/Max-Audio.cfg
        EOF

        # نقل الأيقونة إذا كانت موجودة ف الريبو
        if [ -f "Wolf-Audio.png" ]; then
          cp Wolf-Audio.png data/plugin/Wolf-Audio.png
        fi

        # 3. كتابة ملف الصوتيات مدموج بالروابط الحقيقية (هنا فين كتبدل الرايات والماتشات)
        cat << 'EOF' > data/tuxbox/config/Max-Audio.cfg
        1-MAX1 🇲🇦 VS 🇪🇸 MAR vs ESP|http://anisfm.pp.ua/1
        2-MAX2 🇰🇷 VS 🇨🇱 ORF Austria 19E|http://anisfm.pp.ua/2
        3-live Max1 🇬🇧 VS 🇫🇷 TVP2 13E|http://anisfm.pp.ua/3
        4-live Max2 🇮🇹 VS 🇩🇪 TV KLAN 16E|http://anisfm.pp.ua/4
        5-Bein-Sports-4K-HDR|http://anisfm.pp.ua/5
        6-MAX3 FRANCH|
        7-MAX4 ENGLISH|
        live Max 1 sport|
        live Max 2 sport|
        live Max 3 sport|
        🔊|Bein 1|
        🔊|Bein 2|
        🔊|Bein 3|
        🔊|Bein 4|
        🔊|Bein 5|
        🔊|Bein 6|
        🔊|Bein 7|
        🔊|Bein 8|
        🔊|Bein 9|
        🔊|Bein 10|
        🔊|SSC 1|
        🔊|SSC 2|
        🔊|SSC 3|
        🔊|SSC 4|
        🔊|SSC 5|
        🔊|AD 1|
        🔊|AD 2|
        🔊|قنوات الكأس 1|
        🔊|قنوات الكأس 2|
        🔊|المغربية الرياضية|
        EOF

        # 4. إنشاء سكربت الحالة status.sh داخل wolf_audio وعطيه صلاحية 755
        cat << 'EOF' > data/plugin/wolf_audio/status.sh
        #!/bin/sh
        echo "Wolf Max Audio is Active"
        exit 0
        EOF
        chmod 755 data/plugin/wolf_audio/status.sh

    - name: Package Plugin into NGZ
      run: |
        # ضغط مجلد data بالترتيب المريكل للآيكون
        tar -cf Wolf-Audio.ngz data

    - name: Upload Finished Audio Plugin
      uses: actions/upload-artifact@v4
      with:
        name: Wolf-Max-Audio-Plugin
        path: Wolf-Audio.ngz
