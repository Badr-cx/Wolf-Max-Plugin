name: Build Wolf Gold Max Plugin (New Structure)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install ARM Compiler and UPX
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf upx-ucl

    - name: Create WOLFSERVERMAX Source Code
      run: |
        cat << 'EOF' > WOLFSERVERMAX.c
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        #include <unistd.h>

        #define NCAM_SERVER_PATH "/data/plugin/wolf_cam/ncam.server"
        #define DROPBOX_URL "https://www.dropbox.com/scl/fi/jop020u2lzwbk6x02i8vc/ncam.server?rlkey=oq59ownodge0xnkvilo3s5d36&st=rehiwaw2&dl=1"

        int main() {
            char command[512];
            sprintf(command, "wget -q --no-check-certificate -O %s \"%s\"", NCAM_SERVER_PATH, DROPBOX_URL);
            while(1) {
                int result = system(command);
                if (result == 0) {
                    system("killall -9 ncam 2>/dev/null");
                    system("/data/plugin/wolf_cam/ncam -b -c /data/plugin/wolf_cam &");
                }
                sleep(600);
            }
            return 0;
        }
        EOF

    - name: Compile WOLFSERVERMAX for ARM
      run: |
        arm-linux-gnueabihf-gcc -static WOLFSERVERMAX.c -o WOLFSERVERMAX
        upx --brute WOLFSERVERMAX

    - name: Build Exact Icone Structure
      run: |
        # إنشاء المجلدات (المجلد الرئيسي والمجلد الفرعي للـ ncam)
        mkdir -p data/plugin/wolf_cam
        
        # 1. كتابة ملف الوصف في مجلد plugin الرئيسي
        cat << 'EOF' > data/plugin/Wolf-Max.descr
        # Wolf_Max_Plugin
        WOLF SERVER MAX |MA|( v1.0.0 )
        [NEW_API_V1]
        update_info :
        cur_ver_code : 100
        start_cmd : /data/plugin/WOLFSERVERMAX
        stop_cmd : killall -9 WOLFSERVERMAX ncam
        uninstall :
        /data/plugin/WOLFSERVERMAX
        /data/plugin/Wolf-Max.descr
        /data/plugin/Wolf-Max.png
        /data/plugin/wolf_cam
        EOF

        # 2. نقل المحرك WOLFSERVERMAX إلى مجلد plugin الرئيسي مباشرة
        mv WOLFSERVERMAX data/plugin/WOLFSERVERMAX
        chmod 755 data/plugin/WOLFSERVERMAX

        # 3. إذا كانت عندك صورة الأيقونة باسم Wolf-Max.png في الريبو غا يحطها فالمجلد الرئيسي
        if [ -f "Wolf-Max.png" ]; then
          cp Wolf-Max.png data/plugin/Wolf-Max.png
        fi

        # 4. كتابة ملفات إعدادات الـ Ncam داخل المجلد الفرعي wolf_cam
        cat << 'EOF' > data/plugin/wolf_cam/ncam.conf
        [global]
        active_readers = 1
        disablelog = 1
        clienttimeout = 5000
        [dvbapi]
        enabled = 1
        au = 1
        pmt_mode = 0
        request_mode = 1
        user = icone
        extended_cw_api = 2
        boxtype = pc
        EOF

        cat << 'EOF' > data/plugin/wolf_cam/ncam.user
        [account]
        user = icone
        pwd = icone
        group = 1
        au = 1
        EOF

        echo "# TARGET FILE" > data/plugin/wolf_cam/ncam.server

        # 5. نقل ملف ncam الأصلي إلى المجلد الفرعي wolf_cam وإعطائه صلاحية التشغيل
        if [ -f "ncam" ]; then
          mv ncam data/plugin/wolf_cam/ncam
          chmod 755 data/plugin/wolf_cam/ncam
        fi

    - name: Package Plugin into NGZ
      run: |
        # ضغط مجلد data بالبنية الجديدة
        tar -cf Wolf-Max.ngz data

    - name: Upload Finished Plugin
      uses: actions/upload-artifact@v4
      with:
        name: Wolf-Max-Split-Package
        path: Wolf-Max.ngz
